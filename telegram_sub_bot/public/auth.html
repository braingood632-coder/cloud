<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud — تسجيل الدخول</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/config.js"></script>
</head>
<body class="center-page">
  <div class="card auth-card">
    <a href="/" class="brand"><span class="brand-logo" id="logo"></span>Cloud</a>

    <h2 class="center" style="margin:6px 0 18px">تسجيل الدخول</h2>

    <div id="msg"></div>

    <!-- التسجيل العام مغلق: الحسابات ينشئها أدمن المنصة فقط -->
    <form id="loginForm" novalidate>
      <div class="field"><label for="lUser">اسم المستخدم</label><input id="lUser" autocomplete="username" required class="ltr" /></div>
      <div class="field"><label for="lPass">كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password" required class="ltr" /></div>
      <button class="btn btn-primary btn-block" type="submit">دخول</button>
      <p class="center muted" style="margin-top:16px">ليس لديك حساب أو نسيت كلمة المرور؟ تواصل مع إدارة المنصة<span id="support"></span>.</p>
    </form>
  </div>

<script type="module">
  import { ICONS, $, esc, authErrorMessage } from "/assets/common.js";
  import { auth, configured, onAuthStateChanged, signInWithEmailAndPassword } from "/assets/firebase.js";

  const cfg = window.CLOUD_CONFIG || {};
  const loginDomain = cfg.loginDomain || "users.cloudtg.fyi";
  $("#logo").innerHTML = ICONS.cloud;
  if (cfg.supportUsername) {
    $("#support").innerHTML = ` <a class="ltr" href="https://t.me/${encodeURIComponent(cfg.supportUsername)}" target="_blank" rel="noopener">@${esc(cfg.supportUsername)}</a>`;
  }
  const msg = (text, type = "error") => ($("#msg").innerHTML = text ? `<div class="alert alert-${type}">${esc(text)}</div>` : "");
  history.replaceState(null, "", location.pathname);

  if (!configured) msg("لم يتم ضبط إعدادات Firebase في السيرفر بعد.");

  onAuthStateChanged(auth, (u) => { if (u) location.replace("/dashboard.html"); });

  const busy = (form, on) => form.querySelectorAll("button").forEach((b) => (b.disabled = on));

  // اسم المستخدم -> بريد داخلي (username@loginDomain). حساب الأدمن يدخل بإيميله كما هو.
  const toEmail = (v) => (v.includes("@") ? v : `${v.toLowerCase()}@${loginDomain}`);

  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = $("#lUser").value.trim();
    if (!user || !$("#lPass").value) return msg("اكتب اسم المستخدم وكلمة المرور.");
    busy(e.target, true);
    try {
      await signInWithEmailAndPassword(auth, toEmail(user), $("#lPass").value);
    } catch (err) {
      msg(authErrorMessage(err));
      busy(e.target, false);
    }
  });
</script>
</body>
</html>
